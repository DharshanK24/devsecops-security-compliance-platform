services:

  postgres:
    image: postgres:16
    container_name: devsecops-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devsecops

    ports:
      - "5432:5432"

    networks:
      - devsecops-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devsecops"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devsecops-backend

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - devsecops-network


networks:
  devsecops-network:
    external: true