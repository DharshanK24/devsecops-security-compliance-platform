services:

  postgres:
    image: postgres:16
    container_name: devsecops-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devsecops

    ports:
      - "5432:5432"

    networks:
      - devsecops-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devsecops"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devsecops-backend

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - devsecops-network


  # ==========================================
  # PROMETHEUS MONITORING
  # ==========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: devsecops-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - devsecops-network

    depends_on:
      - backend


  # ==========================================
  # GRAFANA MONITORING DASHBOARD
  # ==========================================

  grafana:
    image: grafana/grafana:latest
    container_name: devsecops-grafana

    ports:
      - "3000:3000"

    networks:
      - devsecops-network

    depends_on:
      - prometheus


  # ==========================================
  # NGINX REVERSE PROXY
  # ==========================================

  nginx:
    image: nginx:latest
    container_name: devsecops-nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    networks:
      - devsecops-network


networks:
  devsecops-network:
    external: true